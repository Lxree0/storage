<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Appunti</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .upload-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(12px);
        }
        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label { font-weight: 600; color: var(--text-primary); }
        select, input[type="file"] {
            padding: 0.75rem;
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: var(--accent-blue);
            color: #0b0f19;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        button[type="submit"]:hover { background: #0ea5e9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <header>
        <span class="badge">Condivisione</span>
        <h1>Aggiungi Appunti</h1>
        <p>Carica un file PDF nella categoria corretta.</p>
    </header>

    <div class="upload-container">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="category">Seleziona Categoria:</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected>-- Scegli una materia --</option>
                    {% for key, cat in categories.items() %}
                        <option value="{{ key }}">{{ cat.title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="file">File PDF:</label>
                <input type="file" name="file" id="file" accept=".pdf" required>
            </div>

            <button type="submit">Carica File</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" style="color: var(--text-secondary); text-decoration: none;">&larr; Torna alla Dashboard</a>
        </div>
    </div>
</body>
</html>
